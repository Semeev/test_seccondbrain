    <!-- brow ridge -->
    <path d="M340 432 C420 396 604 396 684 432" stroke="#6b4214" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- opening -->
    <path d="M356 452 C400 424 460 424 498 438 L498 572 L526 572 L526 438 C564 424 624 424 668 452 C624 490 570 494 542 494 L572 740 L452 740 L482 494 C454 494 400 490 356 452 Z"
