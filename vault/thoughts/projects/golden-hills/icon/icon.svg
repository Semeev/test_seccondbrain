    <path d="M664 640 C624 660 594 690 584 712" stroke="#6b4214" stroke-width="6" fill="none" opacity=".7"/>
  </g>
  <text x="512" y="930" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="250"
