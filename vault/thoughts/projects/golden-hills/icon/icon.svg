<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#140d0a"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d58a"/>
      <stop offset=".45" stop-color="#d39a3c"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="bronzeTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a0"/>
      <stop offset=".55" stop-color="#e0a548"/>
      <stop offset="1" stop-color="#9c6420"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b2f"/>
      <stop offset="1" stop-color="#a3120c"/>
