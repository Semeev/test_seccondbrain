<title>Снабжение Golden Hills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: calm, large-print tool. Search and three big tab buttons on top, then one column of result blocks.
   On phones the price tables turn into stacked rows, so nothing scrolls sideways. */
:root {
  --bg: #f0f1f0;
  --surface: #ffffff;
  --line: #cfd3d0;
  --fg: #1e2320;
  --muted: #4f5753;
  --accent: #3e5c6e;
  --accent-soft: #e3e9ec;
  --best: #3d6650;
  --best-soft: #e4ece6;
  --warn: #6e5733;
  --warn-soft: #efe9dd;
  --bad: #7d4a42;
  --bad-soft: #f1e6e3;
  --chip: #e7e9e7;
  --unpaid-bg: rgb(214 69 56 / 0.16);
  --unpaid-line: rgb(190 60 48 / 0.55);
  --paid-bg: rgb(46 160 90 / 0.17);
  --paid-line: rgb(40 130 75 / 0.55);
  --font-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tap: 56px;
  --radius: 12px;
}
/* Always light: one calm look on every device, whatever the system theme */
:root, :root[data-theme="dark"] { color-scheme: light }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 18px; line-height: 1.55; font-variant-numeric: tabular-nums }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button, input, select, textarea { font: inherit; color: inherit }

header { background: var(--surface); border-bottom: 1px solid var(--line) }
header .wrap { display: grid; gap: 14px; padding-block: 18px }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap }
.brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em }
.brand .meta { color: var(--muted); font-size: 15px }
/* Search: labelled, framed in the accent colour, with a magnifier, so it reads as the place to type */
.search { display: grid; gap: 8px }
.q-label { font-size: 19px; font-weight: 700; color: var(--fg) }
.q-box { position: relative }
.q-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; color: var(--accent); pointer-events: none }
.search input { width: 100%; font-size: 20px; min-height: 64px; padding: 12px 64px 12px 54px; border: 3px solid var(--accent); border-radius: var(--radius); background: var(--surface); color: var(--fg); box-shadow: 0 2px 8px rgb(62 92 110 / 0.15) }
.search input::placeholder { color: var(--muted); opacity: 1 }
.search input:focus { outline: none; box-shadow: 0 0 0 4px var(--accent-soft) }
.search button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 0; background: var(--chip); color: var(--fg); font-size: 26px; line-height: 1; cursor: pointer; border-radius: 10px }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px }
.tabs button { min-height: var(--tap); font-size: 18px; font-weight: 600; border: 2px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 10px; border-radius: var(--radius); cursor: pointer; line-height: 1.2 }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.tabs .n { display: block; font-size: 14px; font-weight: 400; opacity: 0.85 }

main { padding-block: 20px 56px }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px }
.toggle { display: inline-flex; align-items: center; gap: 12px; font-size: 17px; min-height: var(--tap); padding: 8px 18px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; user-select: none }
.toggle input { width: 24px; height: 24px; accent-color: var(--accent); margin: 0; flex: none }
.toggle:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
select.toggle { color: var(--fg); padding-right: 12px }
.count { color: var(--muted); font-size: 16px }

.stack { display: grid; gap: 18px }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-width: 0 }
.block-head { display: grid; gap: 4px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line) }
.block-head h2 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3; text-wrap: balance }
.block-head .sub { color: var(--muted); font-size: 16px }
.spread { font-size: 16px; color: var(--muted) }
.spread b { color: var(--bad); font-weight: 600 }

.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 17px }
th { text-align: left; font-weight: 600; font-size: 15px; color: var(--muted); padding: 10px 16px; white-space: nowrap; background: var(--bg) }
td { padding: 14px 16px; border-top: 1px solid var(--line); vertical-align: top }
td.num, th.num { text-align: right; white-space: nowrap }
td.num strong { font-size: 21px; font-weight: 700 }
tr.best td { background: var(--best-soft) }
tr.best td.num strong { color: var(--best) }
.diff { display: block; font-size: 15px; color: var(--bad) }
.diff.zero { color: var(--best); font-weight: 600 }
.sname { font-size: 18px; font-weight: 600; cursor: pointer; color: var(--accent); background: none; border: 0; padding: 4px 0; text-align: left; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px }
.small { font-size: 15px; color: var(--muted) }
.phone { font-size: 18px; font-weight: 500; overflow-wrap: anywhere; min-width: 0 }
.copy { font-size: 16px; font-weight: 500; min-height: 44px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 6px 14px; cursor: pointer; margin: 6px 0 0 }
.copy:hover { border-color: var(--accent) }
.copy.ok { border-color: var(--best); color: var(--best) }
.contact { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px }

.chip { display: inline-block; font-size: 14px; font-weight: 500; padding: 3px 10px; border-radius: 8px; background: var(--chip); color: var(--muted); white-space: nowrap }
.chip.factory { background: var(--best-soft); color: var(--best) }
.chip.stock { background: var(--accent-soft); color: var(--accent) }
.chip.trader { background: var(--bad-soft); color: var(--bad) }
.chip.shop { background: var(--warn-soft); color: var(--warn) }
.chip.ours { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0 }
.card h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3 }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 17px; margin: 0 }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.open, .btn, .close { min-height: var(--tap); font-size: 18px; font-weight: 600; border-radius: var(--radius); padding: 10px 20px; cursor: pointer }
.open { width: 100%; color: var(--accent); background: var(--accent-soft); border: 2px solid transparent }
.open:hover { border-color: var(--accent) }

.empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 18px }
.hint { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; justify-content: center }
.hint button { font-size: 17px; min-height: 48px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--radius); padding: 6px 16px; cursor: pointer }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px }
.cat { text-align: left; font-size: 18px; min-height: 72px; background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px 16px; cursor: pointer }
.cat:hover, .hint button:hover { border-color: var(--accent) }
.cat { display: grid; grid-template-columns: 52px 1fr; column-gap: 14px; row-gap: 2px; align-items: center }
.cat .ic { grid-row: span 2; width: 52px; height: 52px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center }
.cat .ic svg { width: 30px; height: 30px }
.cat-title { display: flex; align-items: center; gap: 12px }
.cat-title .ic { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none }
.cat-title .ic svg { width: 28px; height: 28px }
.tabs button { display: grid; justify-items: center; gap: 2px }
.tabs svg { width: 24px; height: 24px }
.chip svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px }
.cat b { font-weight: 600 }
.cat.cat-all { border-color: var(--accent) }
.cat .cnt { color: var(--muted); font-size: 15px }
.cat-head { display: grid; gap: 14px; margin-bottom: 18px }
.cat-title { margin: 0; font-size: 26px; line-height: 1.25; text-wrap: balance }
.back { justify-self: start; min-height: 48px; font-size: 17px; font-weight: 600; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 18px; cursor: pointer }
.back:hover { border-color: var(--accent) }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.seg button { min-height: var(--tap); font-size: 18px; font-weight: 600; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); cursor: pointer; padding: 6px 10px }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent) }
.nom { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 16px }
.nom li { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 6px }
.nom li span:last-child { white-space: nowrap; font-weight: 600 }
.nom .more { color: var(--muted); border: 0; padding-top: 0 }
/* Gallery: tiles inside a category and in a supplier card */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.tile { text-align: left; background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; min-height: 150px }
button.tile { cursor: pointer }
button.tile:hover { border-color: var(--accent) }
.tile .t-name { font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere }
.tile .t-price { font-size: 22px; font-weight: 700; color: var(--best); line-height: 1.2 }
.tile .t-unit { font-size: 14px; color: var(--muted) }
.tile .t-meta { font-size: 15px; color: var(--muted); overflow-wrap: anywhere }
.tile .t-more { margin-top: auto; font-size: 15px; font-weight: 600; color: var(--accent) }
.tile.off { background: var(--bg); border-style: dashed }
.tile.off .t-price { color: var(--muted); font-size: 17px; font-weight: 500 }
.tile .ic { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center }
.tile .ic svg { width: 26px; height: 26px }
.tile .phone { font-size: 16px }
/* Grade groups (steel А240/А400/А500С, cement ПЦ 400/500) */
.grades { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }
.grades button { display: inline-flex; align-items: center; gap: 10px; min-height: var(--tap); font-size: 17px; font-weight: 600; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 14px 6px 8px; cursor: pointer }
.grades button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.grades button.all { padding-left: 14px }
.gb { display: inline-grid; place-items: center; min-width: 58px; height: 40px; padding: 0 8px; border-radius: 10px; font-size: 16px; font-weight: 800; letter-spacing: 0.02em; border: 2px solid currentColor }
.gb.g0 { color: var(--accent); background: var(--accent-soft) }
.gb.g1 { color: var(--best); background: var(--best-soft) }
.gb.g2 { color: var(--warn); background: var(--warn-soft) }
.gb.g3 { color: var(--bad); background: var(--bad-soft) }
.gb.gx { color: var(--muted); background: var(--chip); font-size: 14px }
.grade-sec { display: grid; gap: 12px; margin-bottom: 26px }
.grade-head { display: flex; align-items: center; gap: 14px; margin: 0; font-size: 21px }
.grade-head .gb { min-width: 72px; height: 48px; font-size: 18px }
.grade-head span.gh { display: grid; line-height: 1.25 }
.grade-head small { font-size: 16px; font-weight: 400; color: var(--muted) }
.tile .gb { min-width: 0; height: 26px; font-size: 13px; padding: 0 7px; border-width: 1.5px; justify-self: start; border-radius: 7px }
.drawer { grid-auto-rows: max-content }
/* Tasks */
.task-add { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 16px }
.task-add input { min-height: var(--tap); font-size: 18px; border: 3px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; background: var(--surface); color: var(--fg); min-width: 0 }
.task-add input:focus { outline: none; box-shadow: 0 0 0 4px var(--accent-soft) }
.tasks { display: grid; gap: 10px }
.task { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 12px }
.task.done { background: var(--bg) }
.task.done .tt { text-decoration: line-through; color: var(--muted) }
.tick { width: 52px; height: 52px; border-radius: 12px; border: 3px solid var(--accent); background: var(--surface); color: var(--surface); display: grid; place-items: center; cursor: pointer }
.tick svg { width: 32px; height: 32px }
.task.done .tick { background: var(--best); border-color: var(--best) }
.tt { font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; min-width: 0 }
.tmeta { display: block; font-size: 14px; color: var(--muted); margin-top: 2px }
.tdel { min-height: 44px; font-size: 15px; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 12px; cursor: pointer; color: var(--muted) }
.tdel.sure { border-color: var(--bad); color: var(--bad); font-weight: 600 }
.note-box { padding: 16px 18px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); font-size: 17px }
/* Payments: invoices and contracts by status (waiting for a decision → queued for payment → paid) */
.pay-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px }
.pay-sum button { text-align: left; min-height: 76px; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 14px; cursor: pointer; display: grid; gap: 2px; align-content: start }
.pay-sum button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.pay-sum b { font-size: 17px }
.pay-sum .ps-n { font-size: 15px; color: var(--muted) }
.pay-sum .ps-s { font-size: 18px; font-weight: 700 }
.pays { display: grid; gap: 12px }
.pay { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; min-width: 0 }
.pay.queue { background: var(--unpaid-bg); border-color: var(--unpaid-line) }
.pay.paid { background: var(--paid-bg); border-color: var(--paid-line) }
.pay.archive { background: var(--bg) }
.pay-sum button[data-payview="queue"] { background: var(--unpaid-bg); border-color: var(--unpaid-line) }
.pay-sum button[data-payview="paid"] { background: var(--paid-bg); border-color: var(--paid-line) }
.pay-sum button[data-payview="queue"][aria-pressed="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) }
.pay-sum button[data-payview="paid"][aria-pressed="true"] { border-color: var(--best); box-shadow: 0 0 0 1px var(--best) }
.pay.archive .pay-amt { color: var(--muted) }
.pay-top { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; align-items: baseline }
.pay-sup { font-size: 19px; font-weight: 700; overflow-wrap: anywhere }
.pay-amt { font-size: 22px; font-weight: 700; white-space: nowrap }
.pay-doc { font-size: 16px; color: var(--muted) }
.pay-what, .pay-terms { font-size: 16px; overflow-wrap: anywhere }
.pay-terms { color: var(--muted) }
.due { justify-self: start; font-size: 15px; font-weight: 600; padding: 3px 10px; border-radius: 8px; background: var(--chip); color: var(--muted) }
.due.soon { background: var(--warn-soft); color: var(--warn) }
.due.late { background: var(--bad-soft); color: var(--bad) }
.due.ok { background: var(--best-soft); color: var(--best) }
.pay-act { display: flex; gap: 8px; flex-wrap: wrap }
.pay-act button { min-height: 48px; font-size: 16px; font-weight: 600; border-radius: 10px; padding: 6px 14px; cursor: pointer; border: 2px solid var(--line); background: var(--surface); color: var(--fg) }
.pay-act button.main { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.pay-act button.sure { border-color: var(--bad); color: var(--bad) }
.pay-items { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px }
.pay-items table { font-size: 17px }
.pay-items tbody td:first-child { font-weight: 600 }
.pay-items th { padding: 8px 10px }
.pay-items td { padding: 8px 10px }
.pay-items td.num { white-space: nowrap }
.pay-items tfoot td { font-weight: 700; border-top: 2px solid var(--line) }
/* состав — сетка как в Excel (решение пользователя 27.11.2026) */
.pay-items { border: 1.5px solid #9aa39e; background: #fff }
.pay-items table { border-collapse: collapse; width: 100% }
.pay-items th, .pay-items td { border: 1px solid #b9c0bc }
.pay-items thead th { background: #dfe6e2; color: var(--fg); font-weight: 700; border-bottom: 2px solid #8e9893 }
.pay-items tbody tr:nth-child(even) td { background: #f3f6f4 }
.pay-items tbody tr:nth-child(odd) td { background: #fff }
.pay-items tfoot td { background: #e8eeea; border-top: 2px solid #8e9893 }
/* состав на телефоне — одна строка на позицию, компактно, без прокрутки вбок (решение пользователя 27.11.2026) */
@media (max-width: 700px) {
  .pay-items { overflow-x: visible }
  .pay-items table { font-size: 13px; width: 100%; table-layout: auto }
  .pay-items th { padding: 6px 4px; font-size: 12px }
  .pay-items td { padding: 7px 4px; vertical-align: top }
  .pay-items th:first-child, .pay-items td:first-child { padding-left: 8px }
  .pay-items th:last-child, .pay-items td:last-child { padding-right: 8px }
  .pay-items td:first-child { word-break: break-word; hyphens: auto }
  .pay-items td.num { font-size: 14.5px; font-weight: 500 }
  .pay-items tbody td.num:last-child { font-weight: 600 }
  .pay-items tfoot td, .pay-items tfoot td.num { font-size: 15px; font-weight: 700 }
}
.pay-note { font-size: 14px; color: var(--muted) }
.pay-doc-view { display: grid; gap: 10px }
.pay-doc-view canvas { width: 100%; height: auto; display: block; background: #fff; border: 1px solid var(--line); border-radius: 6px }
.pay-add { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr auto; gap: 8px; margin-top: 18px; align-items: end }
.pay-add .field { font-size: 15px }
.pay-add .field input { min-height: 48px; font-size: 16px }
@media (max-width: 700px) { .pay-sum { gap: 6px } .pay-sum button { padding: 8px 8px; min-height: 0 } .pay-sum b { font-size: 14px } .pay-sum .ps-n { font-size: 12px } .pay-sum .ps-s { font-size: 13px } .pay-add { grid-template-columns: 1fr } }
@media (max-width: 700px) { .task { grid-template-columns: 52px 1fr; } .tdel { grid-column: 2; justify-self: start } }
.drawer .gallery { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)) }
.drawer .tile { min-height: 0 }
.section-title { font-size: 19px; color: var(--fg); margin: 8px 0 12px; font-weight: 600 }
.sup-group { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px }
.sup-group .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none }
.sup-group .ic svg { width: 20px; height: 20px }
.nom-cat { font-size: 21px; font-weight: 700; color: var(--fg); margin: 22px 0 0; padding-top: 14px; border-top: 2px solid var(--line, #ddd) }
.nom-kind { font-size: 17px; font-weight: 600; color: var(--fg); margin: 14px 0 8px }
.nom-kind span { font-weight: 400; opacity: .6 }

/* Supplier detail panel */
.drawer-bg { position: fixed; inset: 0; background: rgb(0 0 0 / 0.4); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; box-shadow: -8px 0 32px rgb(0 0 0 / 0.2) }
.drawer h2.title { margin: 0 0 4px; font-size: 24px; line-height: 1.3 }
.close { width: 100%; border: 2px solid var(--line); background: var(--surface); color: var(--fg) }
.drawer .card-body { padding: 18px }

/* Request builder */
.rfq { display: grid; gap: 16px; grid-template-columns: 1fr 1fr }
.rfq > * { min-width: 0 }
.field { display: grid; gap: 6px; font-size: 17px; font-weight: 600; color: var(--fg) }

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .toggle:focus-within { outline: 3px solid var(--accent); outline-offset: 2px }

.digest-days { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }

/* PDF digest viewer: pages drawn on canvases inside the tab, so it works in the phone app too */

/* price tables become stacked rows when their own box is narrow (phone, or the side drawer on a wide screen):

<script>
/* Line icons (24×24, stroke = currentColor), one per category and supplier type */
const I = {

  tree: '<path d="M12 21v-5"/><path d="M12 3 6 11h3l-4 5h14l-4-5h3z"/>',
  mesh: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>',
  fitting: '<path d="M4 9h6v6H4zM14 9h6v6h-6z"/><path d="M10 12h4M12 5v4M12 15v4"/>',
  box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  steel: '<path d="M4 6h16M4 18h16M12 6v12"/><path d="M8 6v2M16 6v2M8 16v2M16 16v2"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  doc: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  factory: '<path d="M3 21V11l5 3v-3l5 3V4h4v17z"/><path d="M3 21h18"/>',
  warehouse: '<path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-8h10v8M7 17h10"/>',
  shop: '<path d="M4 10v11h16V10"/><path d="M3 4h18l-1 6H4z"/><path d="M10 21v-5h4v5"/>',
  trader: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  tasks: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="m7 10 2 2 4-4M7 16h.01M11 16h6M15 10h2"/>',
  tick: '<path d="m5 12.5 4.5 4.5L19 7"/>',
  wallet: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M6 6l9-3 1 3"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9.5"/>',
  question: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>'
};
const CAT_ICONS = [[/фитинг|запорн/i, 'fitting'], [/хомут/i, 'wrench'], [/^трубы и /i, 'pipe'], [/арматур|металлопрок/i, 'rebar'], [/бетон/i, 'mixer'], [/цемент|сух/i, 'bag'], [/газоблок|кирпич/i, 'brick'], [/кровл/i, 'roof'],
  [/гидроиз/i, 'drop'], [/пожаротуш|спринклер/i, 'fire'], [/пожарн|впв/i, 'hydrant'], [/дымоуд|вентил/i, 'fan'], [/электро/i, 'bolt'], [/кабел/i, 'cable'],
  [/окн/i, 'window'], [/двер/i, 'door'], [/утепл/i, 'layers'], [/фасад/i, 'facade'], [/опалуб|лес/i, 'wood'], [/метиз/i, 'screw'], [/инертн/i, 'sand'],
  [/отоплен/i, 'radiator'], [/монтаж/i, 'wrench'], [/счётчик|счетчик/i, 'meter'], [/лкм/i, 'roller'], [/гкл|перегород/i, 'panel'], [/сиз|спецодеж/i, 'helmet'],
  [/гсм/i, 'fuel'], [/благоустр/i, 'tree'], [/сетк/i, 'mesh'], [/труб|ливн|канализ/i, 'pipe']];
const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name] || I.box}</svg>`;
const catIcon = c => svg((CAT_ICONS.find(([re]) => re.test(c)) || [0, 'box'])[1]);
const typeIcon = t => !t || t === 'Не проверено' ? 'question' : t.startsWith('Завод') ? 'factory' : t.startsWith('Склад') ? 'warehouse' : t.startsWith('Магазин') ? 'shop' : 'trader';
document.querySelectorAll('svg[data-i]').forEach(el => { el.outerHTML = svg(el.dataset.i) });

const S = { data: null, tab: 'prices', dday: '', cat: '', catView: 'prices', grade: '', supCat: '', supGroup: '', catGroup: '', q: '', direct: false, vat: false, history: false, stype: '', rfqItem: '', rfqQty: '', rfqSel: new Set() };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\s/g, ' ');
const fdate = d => d ? d.split('-').reverse().slice(0, 2).join('.') : '';
const norm = s => String(s ?? '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"']/g, '');
const unitLbl = u => u ? `сум за ${u}` : 'сум';

function typeClass(t) {
  if (!t) return '';
  if (t.startsWith('Завод')) return 'factory';
  if (t.startsWith('Склад')) return 'stock';
  if (t.startsWith('Перекуп') || t.startsWith('Трейдер')) return 'trader';
  if (t.startsWith('Магазин')) return 'shop';
  return '';
}
const typeShort = t => !t ? 'тип неизвестен' : t === 'Не проверено' ? 'тип не проверен' : t.replace('Склад/дистрибьютор', 'Склад').replace('Завод-производитель', 'Завод').replace('Магазин (розница)', 'Магазин');
const chip = t => `<span class="chip ${typeClass(t)}">${svg(typeIcon(t))}${esc(typeShort(t))}</span>`;
const isDirect = t => t && (t.startsWith('Завод') || t.startsWith('Склад'));

function copyBtn(text, label = 'Копировать') {
  return `<button class="copy" data-copy="${esc(text)}">${label}</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const t = b.dataset.copy, old = b.textContent;
  const done = () => { b.textContent = 'Скопировано'; b.classList.add('ok'); setTimeout(() => { b.textContent = old; b.classList.remove('ok') }, 1600) };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); done() } catch (_) {} ta.remove();
  };
  try { navigator.clipboard.writeText(t).then(done).catch(fallback) } catch (_) { fallback() }
});

/* Search that ignores alphabet: «полимер» finds «Polimer», «метал сити» finds «Metal City»; ПЭ = ПНД = PE */
const CYR = { а:'a', б:'b', в:'v', г:'g', д:'d', е:'e', ж:'j', з:'z', и:'i', й:'i', к:'k', л:'l', м:'m', н:'n', о:'o', п:'p', р:'r', с:'s', т:'t', у:'u', ф:'f', х:'h', ц:'s', ч:'ch', ш:'sh', щ:'sh', ъ:'', ы:'i', ь:'', э:'e', ю:'yu', я:'ya', ў:'o', қ:'k', ғ:'g', ҳ:'h' };
const key = s => norm(s).replace(/[а-яўқғҳ]/g, c => CYR[c] ?? c)
  .replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k').replace(/q/g, 'k').replace(/x/g, 'ks').replace(/w/g, 'v').replace(/kh/g, 'h').replace(/zh|dzh|dj/g, 'j')
  .replace(/y(?=[aeiou])/g, '').replace(/y/g, 'i').replace(/([a-z])\1/g, '$1');
const SYN = [['pe', 'pnd', 'pe100', 'polietilen'], ['pp', 'polipropilen']];
function termKeys(t) { const k = key(t); const g = SYN.find(x => x.includes(k)); return g || [k.length > 4 ? k.replace(/[aeiou]+$/, '') : k] }  // «трубы» → «труб», so word endings do not matter
function matches(text, terms) { const n = key(text); return terms.every(t => termKeys(t).some(k => n.includes(k))) }
function terms() { return norm(S.q).split(/\s+/).filter(Boolean) }

/* ---------- prices ---------- */
function offers() {
  let rows = S.data.prices.map(p => ({ ...p, sup: S.data.supIdx[p.supplier] || {} }));
  if (!S.history) {
    const m = new Map();  /* последняя дата по поставщику; строки одной даты (разные производители) — все */
    for (const r of rows) { const k = r.item + '|' + r.supplier; if (!m.has(k)) m.set(k, []); m.get(k).push(r) }
    rows = [...m.values()].flatMap(rs => {
      const d = rs.reduce((x, r) => (r.date || '') > x ? r.date || '' : x, '');
      const cur = rs.filter(r => (r.date || '') === d).map(r => ({ ...r, older: [] }));
      cur[0].older = rs.filter(r => (r.date || '') !== d);
      return cur;
    });
  }
  if (S.direct) rows = rows.filter(r => isDirect(r.stype));
  if (S.vat) rows = rows.filter(r => r.vat === 'Да');
  if (S.stype) rows = rows.filter(r => (r.stype || '') === S.stype);
  return rows;
}

function priceFilters() {
  return `<div class="filters">
    <label class="toggle"><input type="checkbox" id="f-direct" ${S.direct ? 'checked' : ''}> Только заводы и склады</label>
    <label class="toggle"><input type="checkbox" id="f-vat" ${S.vat ? 'checked' : ''}> Только с НДС</label>
    <label class="toggle"><input type="checkbox" id="f-hist" ${S.history ? 'checked' : ''}> Показать старые цены</label>
  </div>`;
}
function priceBlocks(rows) {
  const groups = new Map();
  for (const r of rows) { if (!groups.has(r.item)) groups.set(r.item, []); groups.get(r.item).push(r) }
  const list = [...groups.entries()].sort((a, b) => catRank(a[1][0].cat) - catRank(b[1][0].cat) || itemRank(a[0]) - itemRank(b[0]));
  return `<div class="stack">` + list.map(([item, rs]) => {
    rs.sort((a, b) => a.price - b.price);
    const min = rs[0].price, max = rs[rs.length - 1].price;
    const u = rs[0].unit || rs[0].rawunit;
    const spread = rs.length > 1 && max > min ? `<span class="spread">Самая дорогая на <b>${Math.round((max / min - 1) * 100)}%</b> дороже лучшей</span>` : '';
    return `<section class="block">
      <div class="block-head"><h2>${esc(item)}</h2><span class="sub">${S.cat ? '' : esc(rs[0].cat || '') + ' · '}${unitLbl(u)} · ${rs.length} ${plural(rs.length, 'предложение', 'предложения', 'предложений')}</span>${spread}</div>
      <div class="tbl"><table class="offers">
        <thead><tr><th>Поставщик</th><th class="num">Цена, ${unitLbl(u)}</th><th>Условия</th><th>Телефон</th><th>Дата</th></tr></thead>
        <tbody>${rs.map((r, i) => offerRow(r, min, i === 0 && rs.length > 1)).join('')}</tbody>
      </table></div></section>`;
  }).join('') + `</div>`;
}
/* Priority: category order from данные/приоритет_категорий.json, then how often the price is checked */
const catRank = c => { const i = (S.data.catOrder || []).indexOf(c || 'Прочее'); return i < 0 ? 999 : i };
const FREQ = { 'Ежедневно': 0, 'Еженедельно': 1, 'Ежемесячно': 2 };
let posIdx;
const posOf = name => (posIdx ||= Object.fromEntries(S.data.positions.map(p => [p.name, p])))[name] || {};
const itemRank = name => { const f = (S.data.itemsFirst || []).indexOf(name); if (f >= 0) return f - 1000; const p = posOf(name); return (FREQ[p.freq] ?? 3) * 10000 + (p.idx ?? 9999) };
const supRank = name => Math.min(999, ...S.data.prices.filter(p => p.supplier === name).map(p => catRank(p.cat)));
function categories() {
  const m = new Map();
  const get = c => { if (!m.has(c)) m.set(c, { name: c, positions: 0, prices: 0 }); return m.get(c) };

/* PDF digest: drawn inside the page with pdf.js (loaded on first use); saved through the viewer's downloads capability.
   Opening the file in a new tab does not work inside the Claude frame on phones, so neither path relies on it. */
const PDF = { shown: '', msg: '', lib: null, cache: {} };
function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.append(s) }) }
async function pdfLib() {
  if (PDF.lib) return PDF.lib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base + 'pdf.min.js');
  await loadScript(base + 'pdf.worker.min.js');  // defines pdfjsWorker → pdf.js runs it in this page, no separate worker origin needed
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  return (PDF.lib = window.pdfjsLib);
}
async function pdfBytes(path) {
  if (!PDF.cache[path]) { const r = await fetch(path); if (!r.ok) throw new Error('HTTP ' + r.status); PDF.cache[path] = await r.arrayBuffer() }
  return PDF.cache[path];
}
function pdfMsg(m) { PDF.msg = m; const el = $('#pdf-status'); if (el) { el.textContent = m; el.hidden = !m } }
async function showPdf(path) {
  const box = $('#pdf-view'); if (!box) return;
  PDF.shown = path; box.hidden = false; box.textContent = ''; pdfMsg('Загружаю сводку…');
  $('#pdf-show').textContent = 'Скрыть сводку';
  try {
    const lib = await pdfLib();
    const doc = await lib.getDocument({ data: (await pdfBytes(path)).slice(0) }).promise;
    const width = Math.min(box.clientWidth || 800, 1100), ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= doc.numPages; i++) {
      if (PDF.shown !== path) return;
      pdfMsg(`Страница ${i} из ${doc.numPages}…`);
      const page = await doc.getPage(i);
      const vp = page.getViewport({ scale: width / page.getViewport({ scale: 1 }).width * ratio });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.setAttribute('aria-label', `Страница ${i}`);
      box.append(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    pdfMsg('');
  } catch (err) {
    pdfMsg('Не получилось показать сводку здесь. Нажмите «Скачать PDF» — файл откроется на устройстве.');
  }
}
async function savePdf(btn, msg = pdfMsg) {
  const old = btn.textContent;
  try {
    const dl = await claude.use('downloads');
    if (!dl) { msg('В этом окне скачивание недоступно. Откройте приложение в браузере на claude.ai или нажмите «Показать сводку целиком».'); return }
    btn.textContent = 'Готовлю файл…';
    const bytes = await pdfBytes(btn.dataset.pdf);
    const res = await dl.save({ filename: btn.dataset.name, data: new Blob([bytes], { type: 'application/pdf' }) });
    msg(res.status === 'saved' ? 'Файл сохранён.' : '');
  } catch (err) {
    const c = err && err.code;
    msg(c === 'declined' ? '' : c === 'host_unavailable' ? 'Это приложение не умеет сохранять файлы. Откройте сводку в браузере или на компьютере, либо нажмите «Показать сводку целиком».'
      : c === 'rate_limited' ? 'Окно сохранения уже открыто — подтвердите его или попробуйте через минуту.' : 'Не получилось скачать. Нажмите «Показать сводку целиком».');
  } finally { btn.textContent = old }
}
document.addEventListener('click', e => {
  const s = e.target.closest('#pdf-show');
  if (s) { if (PDF.shown === s.dataset.pdf) { PDF.shown = ''; PDF.msg = ''; render() } else showPdf(s.dataset.pdf); return }
  const d = e.target.closest('#pdf-save'); if (d) savePdf(d);
});

/* ---------- tasks (shared, stored in the artifact's db) ---------- */
const T = { db: null, list: [], state: 'loading', view: 'todo', ro: false, sure: '', busy: false, draft: '' };
function tasksRender() {
  const todo = T.list.filter(x => !x.done), done = T.list.filter(x => x.done);
  const n = $('#n-tasks'); if (n) n.textContent = T.state === 'ok' ? (todo.length ? `осталось ${todo.length}` : 'всё сделано') : T.state === 'off' ? 'нужен вход' : 'загрузка…';
  if (S.tab === 'tasks') render();
}
async function tasksInit() {
  try { T.db = window.claude?.use ? await window.claude.use('db') : null } catch (_) { T.db = null }
  if (!T.db) { T.state = 'off'; tasksRender(); return }
  const timer = setTimeout(() => { if (T.state === 'loading') { T.state = 'slow'; tasksRender() } }, 10000);
  T.db.collection('tasks').onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);

  }, () => { clearTimeout(timer); T.state = 'error'; tasksRender() });

}
tasksInit();
const ddmm = iso => iso ? fdate(iso.slice(0, 10)) : '';
function renderTasks() {
  if (T.state === 'off') return `<div class="note-box">Задачи хранятся в вашем аккаунте Claude. Откройте приложение, войдя в Claude, — тогда список появится и отметки будут сохраняться.</div>`;

  const done = T.list.filter(x => x.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  const list = T.view === 'todo' ? todo : done;
  const add = T.ro ? '<p class="small">Отмечать и добавлять задачи может только владелец приложения.</p>' : `<form class="task-add" id="task-form">
      <input id="task-new" placeholder="Новая задача, например: позвонить на завод" autocomplete="off" aria-label="Новая задача" value="${esc(T.draft)}">
      <button class="btn" type="submit">Добавить</button></form>`;
  const row = x => `<div class="task ${x.done ? 'done' : ''}">
      <button class="tick" data-tick="${esc(x.id)}" aria-pressed="${!!x.done}" aria-label="${x.done ? 'Вернуть в работу' : 'Отметить сделанной'}" ${T.ro ? 'disabled' : ''}>${svg('tick')}</button>
      <div class="tt">${esc(x.title)}${x.note ? `<span class="tmeta">${esc(x.note)}</span>` : ''}<span class="tmeta">${x.done ? 'Сделано ' + ddmm(x.doneAt) : 'Добавлено ' + ddmm(x.created)}</span></div>
      ${T.ro ? '' : `<button class="tdel ${T.sure === x.id ? 'sure' : ''}" data-tdel="${esc(x.id)}">${T.sure === x.id ? 'Точно удалить?' : 'Удалить'}</button>`}</div>`;

    ${list.length ? `<div class="tasks">${list.map(row).join('')}</div>` : `<div class="empty">${T.view === 'todo' ? 'Все задачи сделаны. Новую можно добавить сверху.' : 'Сделанных задач пока нет.'}</div>`}`;

async function taskWrite(fn) {
  if (T.busy) return; T.busy = true;

document.addEventListener('click', e => {

  const del = e.target.closest('[data-tdel]'); if (del) { const id = del.dataset.tdel; if (T.sure === id) { T.sure = ''; taskWrite(() => T.db.collection('tasks').doc(id).delete()) } else { T.sure = id; render() } return }
  const tv = e.target.closest('[data-tview]'); if (tv) { T.view = tv.dataset.tview; T.sure = ''; render() }

/* ---------- payments (shared, stored in the artifact's db, collection "payments") ----------
   Doc: supplier, doc, amount (сум с НДС), what, terms, due (YYYY-MM-DD or ""), dueNote, status: "wait" | "queue" | "paid",
   created, paidAt, order. Claude adds new invoices/contracts as "wait"; the person moves them to the queue and marks them paid. */
const P = { list: [], state: 'loading', view: 'queue', sure: '', busy: false, add: false, open: new Set(), doc: '', ro: true };  // ro until we know the viewer is the owner: only the owner changes payments (db rule payments: write owner)
const PAY_VIEWS = [['queue', 'Ожидают оплаты'], ['paid', 'Оплачено'], ['archive', 'Архив']];  // everything the person sends needs paying; old 'wait' docs count as unpaid; archive = not needed now, can be returned
const payGroup = x => x.status === 'paid' ? 'paid' : x.status === 'archive' ? 'archive' : 'queue';
const money = n => fmt(n || 0) + ' сум';
function payRender() {
  const q = P.list.filter(x => payGroup(x) === 'queue');
  const n = $('#n-pay'); if (n) n.textContent = P.state === 'ok' ? (q.length ? `к оплате ${q.length}` : 'всё оплачено') : P.state === 'off' ? 'нет данных' : 'загрузка…';
  if (S.tab === 'pay') render();
}
async function payInit() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use('db') : null } catch (_) { db = null }
  if (!db) {  // signed-out viewer (no Claude account): read-only snapshot published with the page
    try {
      const s = await (await fetch('payments.json')).json();
      P.list = s.payments || []; P.snapshot = s.snapshotAt || ''; P.ro = true; P.state = 'ok';
    } catch (_) { P.state = 'off' }
    payRender(); return
  }
  P.db = db;
  try { const u = await window.claude.use('user'); P.ro = !((await u?.isOwner()) ?? false) } catch (_) { P.ro = true }
  const timer = setTimeout(() => { if (P.state === 'loading') { P.state = 'slow'; payRender() } }, 10000);
  db.collection('payments').onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    P.list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    P.state = 'ok'; payRender();
  }, () => { clearTimeout(timer); P.state = 'error'; payRender() });
}
payInit();
function dueChip(x) {
  if (x.status === 'paid') return `<span class="due ok">${esc(['Оплачено' + (x.paidAt ? ' ' + fdate(x.paidAt.slice(0, 10)) + '.' + x.paidAt.slice(0, 4) : ''), x.paidNote].filter(Boolean).join(' · '))}</span>`;
  if (x.status === 'archive') return `<span class="due">${esc(['В архиве' + (x.archivedAt ? ' с ' + fdate(x.archivedAt.slice(0, 10)) : ''), x.archiveNote].filter(Boolean).join(' · '))}</span>`;
  if (!x.due && !x.dueNote) return '';
  let cls = '', txt = x.dueNote || '';
  if (x.due) {
    const days = Math.round((new Date(x.due + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
    cls = days < 0 ? 'late' : days <= 3 ? 'soon' : '';
    const when = `до ${fdate(x.due)}`;
    txt = days < 0 ? `Срок прошёл (${when})` : days === 0 ? `Оплатить сегодня (${when})` : `Оплатить ${when} · осталось ${days} ${plural(days, 'день', 'дня', 'дней')}` + (x.dueNote ? ` · ${x.dueNote}` : '');

      <label class="field">Поставщик<input id="pay-sup" required autocomplete="off"></label>
      <label class="field">Документ<input id="pay-doc" placeholder="Счёт № … от …" autocomplete="off"></label>
      <label class="field">Сумма с НДС<input id="pay-amt" inputmode="numeric" required autocomplete="off"></label>
      <label class="field">Оплатить до<input id="pay-due" type="date"></label>
      <button class="btn" type="submit">Добавить</button></form>`
    : `<div class="pay-act" style="margin-top:18px"><button data-pay="addopen">+ Добавить счёт или договор</button></div>`;
  return head + (xs.length ? `<div class="pays">${xs.map(payCard).join('')}</div>` : `<div class="empty">${empty}</div>`) + add;
}
async function payWrite(fn) { if (P.busy || P.ro) return; P.busy = true; try { await fn() } catch (e) { if (e?.code === 'invalid_argument') { P.ro = true; render() } } P.busy = false }
document.addEventListener('click', e => {
  const v = e.target.closest('[data-payview]'); if (v) { P.view = v.dataset.payview; P.sure = ''; P.doc = ''; render(); return }
  const it = e.target.closest('[data-payitems]'); if (it) { const id = it.dataset.payitems; P.open.has(id) ? P.open.delete(id) : P.open.add(id); render(); if (P.doc) showPayDoc(P.doc, P.list.find(x => x.id === P.doc)?.file); return }
  const dc = e.target.closest('[data-paydoc]'); if (dc) { const id = dc.dataset.paydoc; if (P.doc === id) { P.doc = ''; render() } else { P.doc = id; render(); showPayDoc(id, dc.dataset.file) } return }
  const sv = e.target.closest('[data-paysave]'); if (sv) { sv.dataset.pdf = sv.dataset.paysave; const st = document.getElementById('paydoc-status-' + sv.dataset.id);
    savePdf(sv, m => { if (st) { st.textContent = m.replace('«Показать сводку целиком»', '«Открыть договор»'); st.hidden = !m } }); return }
  const b = e.target.closest('[data-pay]'); if (!b) return;
  const act = b.dataset.pay, id = b.dataset.id, ref = id && P.db.collection('payments').doc(id);
  if (act === 'addopen') { P.add = true; render(); $('#pay-sup')?.focus(); return }
  if (act === 'del') { if (P.sure === id) { P.sure = ''; payWrite(() => ref.delete()) } else { P.sure = id; render() } return }
  if (act === 'paid') payWrite(() => ref.update({ status: 'paid', paidAt: new Date().toISOString() }));
  if (act === 'queue') payWrite(() => ref.update({ status: 'queue', paidAt: null, archivedAt: null }));
  if (act === 'archive') payWrite(() => ref.update({ status: 'archive', archivedAt: new Date().toISOString() }));
  if (act === 'wait') payWrite(() => ref.update({ status: 'wait' }));
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'pay-form') return; e.preventDefault();
  const supplier = $('#pay-sup').value.trim(), amount = +$('#pay-amt').value.replace(/[^\d.,]/g, '').replace(',', '.');
  if (!supplier || !amount) return;
  const doc = { supplier, doc: $('#pay-doc').value.trim(), amount, due: $('#pay-due').value || '', status: 'queue', created: new Date().toISOString(), order: Date.now() };
  P.add = false; P.view = 'queue';
  payWrite(() => P.db.collection('payments').add(doc));
});

/* ---------- RFQ ---------- */
function rfqCandidates(item) {
  const pos = S.data.positions.find(p => p.name === item);
  if (!pos) return [];
  const priced = new Set(S.data.prices.filter(p => p.item === item).map(p => p.supplier));
  return S.data.suppliers
    .filter(s => priced.has(s.name) || supInCat(s, pos.cat || 'Прочее'))
    .map(s => ({ ...s, priced: priced.has(s.name) }))
    .sort((a, b) => b.priced - a.priced || isDirect(b.type) - isDirect(a.type) || !!b.phone - !!a.phone);
}
function rfqText() {
  const pos = S.data.positions.find(p => p.name === S.rfqItem);
  if (!pos) return '';
  const q = S.rfqQty.trim();
  return `Здравствуйте!\n\nСП ООО «FM MUHENDISLIK INSAAT», генподрядчик ЖК «Golden Hills» (Ташкент, ул. Олтинтепа, 166), запрашивает коммерческое предложение:\n\n• ${pos.name}${q ? ` — ${q}` : ''}${pos.note ? `\n  Требования: ${pos.note}` : ''}\n\nПросим указать:\n— цену за ${pos.unit || 'единицу'} с НДС и без НДС;\n— стоимость и сроки доставки на объект;\n— наличие и минимальную партию;\n— условия оплаты;\n— срок действия предложения.\n\nКП прошу направить в ответ на это сообщение на фирменном бланке.\nСпасибо!`;
}
function renderRfq() {
  const items = [...S.data.positions].sort((a, b) => catRank(a.cat) - catRank(b.cat) || itemRank(a.name) - itemRank(b.name));
  const byCat = {};
  for (const p of items) (byCat[p.cat || 'Прочее'] ||= []).push(p);
  const cands = S.rfqItem ? rfqCandidates(S.rfqItem) : [];
  const withPhone = cands.filter(c => c.phone);
  const phones = withPhone.map(c => `${c.name} — ${c.phone}${c.person ? ' (' + c.person + ')' : ''}`).join('\n');
  return `<div class="cat-head"><button class="back" data-rfqback>← Назад</button><h2 class="cat-title"><span class="ic">${svg('mail')}</span>Запрос КП</h2></div><section class="block" style="padding:18px"><div class="rfq">
    <label class="field">1. Что запрашиваем
      <select id="rfq-item"><option value="">Выберите материал…</option>${Object.entries(byCat).map(([c, ps]) =>
        `<optgroup label="${esc(c)}">${ps.map(p => `<option ${p.name === S.rfqItem ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <label class="field">2. Сколько нужно<input id="rfq-qty" value="${esc(S.rfqQty)}" placeholder="например, 120 м³ или 25 т"></label>
    ${S.rfqItem ? `<label class="field full">3. Текст запроса (можно исправить)<textarea id="rfq-text">${esc(rfqText())}</textarea></label>
      <div class="full actions"><button class="btn" data-copy="" id="rfq-copy">Скопировать текст</button>
      ${withPhone.length ? copyBtn(phones, `Скопировать телефоны (${withPhone.length})`) : ''}</div>` : `<p class="small full" style="margin:0">Выберите материал — я подготовлю текст запроса и покажу, кому его отправить.</p>`}
  </div></section>
  ${S.rfqItem ? `<p class="section-title" style="margin-top:22px">Кому отправить: ${cands.length}</p>
    ${cands.length ? `<div class="block"><div class="tbl"><table class="offers"><thead><tr><th>Поставщик</th><th>Телефон</th><th>Товары</th></tr></thead><tbody>
    ${cands.map(c => `<tr><td><button class="sname" data-sup="${esc(c.name)}">${esc(c.name)}</button><div class="tags">${chip(c.type)}${c.priced ? '<span class="chip">цена уже есть</span>' : ''}</div></td>
      <td class="contact-cell">${c.phone ? `<div class="contact"><span class="phone">${esc(c.phone)}</span>${copyBtn(c.phone)}</div>` : '<span class="small">телефона нет</span>'}${c.person ? `<div class="small">${esc(c.person)}</div>` : ''}</td>
      <td class="date small">${esc(c.cats || '')}</td></tr>`).join('')}</tbody></table></div></div>` : '<div class="empty">Поставщиков в этой категории пока нет в списке.</div>'}` : ''}`;
}

/* ---------- shell ---------- */
function clearQ() { S.q = ''; $('#q').value = '' }
function render() {
  $('#clear').hidden = !S.q;
  $('#q-label').textContent = S.tab === 'suppliers' ? (S.supCat && !S.supCat.startsWith('__') ? `Найти поставщика в разделе «${S.supCat.replace(/^[ga]:/, '').replace(/^k:[^|]*\|/, '')}»` : 'Найти поставщика — напишите здесь') : S.cat ? `Найти в разделе «${S.cat.replace(/^g:/, '').replace(/^k:[^|]*\|/, '')}»` : 'Найти материал — напишите здесь';
  $('#q').placeholder = S.tab === 'suppliers' ? 'например: Cubix' : S.cat ? 'например: d16' : 'например: бетон';
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab || (S.tab === 'rfq' && b.dataset.tab === 'prices')));
  $('#q').closest('.search').hidden = S.tab === 'rfq' || S.tab === 'digest' || S.tab === 'tasks' || S.tab === 'pay';
  $('#view').innerHTML = S.tab === 'prices' ? renderPrices() : S.tab === 'suppliers' ? renderSuppliers() : S.tab === 'digest' ? renderDigest() : S.tab === 'tasks' ? renderTasks() : S.tab === 'pay' ? renderPay() : renderRfq();
  bind();
}
function bind() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn) };
  on('f-direct', 'change', e => { S.direct = e.target.checked; render() });
  on('f-vat', 'change', e => { S.vat = e.target.checked; render() });
  on('f-hist', 'change', e => { S.history = e.target.checked; render() });
  on('f-stype', 'change', e => { S.stype = e.target.value; render() });
  on('rfq-item', 'change', e => { S.rfqItem = e.target.value; render() });
  on('rfq-qty', 'input', e => { S.rfqQty = e.target.value; const ta = $('#rfq-text'); if (ta) ta.value = rfqText() });
  const cb = $('#rfq-copy'); if (cb) cb.addEventListener('pointerdown', () => { cb.dataset.copy = $('#rfq-text').value });
  const ta = $('#rfq-text'); if (ta && cb) { ta.addEventListener('input', () => { cb.dataset.copy = ta.value }); cb.dataset.copy = ta.value }
}
let timer;
$('#q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { S.q = e.target.value; render() }, 150) });
$('#clear').addEventListener('click', () => { S.q = ''; $('#q').value = ''; render(); $('#q').focus() });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { if (b.dataset.tab !== S.tab || S.tab !== 'rfq') { S.cat = ''; S.catGroup = ''; S.supCat = ''; S.supGroup = ''; clearQ() } S.tab = b.dataset.tab; S.stype = ''; render() }));

fetch('data.json').then(r => r.json()).then(d => {
  d.supIdx = Object.fromEntries(d.suppliers.map(s => [s.name, s]));
  S.data = d;
  const last = d.prices.map(p => p.date).filter(Boolean).sort().pop();
  $('#meta').textContent = `Обновлено ${fdate(last)}.${last.slice(0, 4)}`;
  { const n = mainGroups().length; $('#n-prices').textContent = `${n} ${plural(n, 'раздел', 'раздела', 'разделов')}` }
  $('#n-sup').textContent = `${d.suppliers.length} шт.`;
  $('#n-dig').textContent = d.digests?.length ? `за ${fdate(d.digests[0].date)}` : '';
  render();
}).catch(() => { $('#view').innerHTML = '<div class="empty">Не удалось загрузить базу. Обновите страницу.</div>' });
</script>
