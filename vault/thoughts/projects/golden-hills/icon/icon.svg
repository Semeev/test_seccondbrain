      <path d="M512 400 L512 140"/><path d="M512 400 L440 150"/><path d="M512 400 L584 150"/>
      <path d="M512 400 L375 180"/><path d="M512 400 L649 180"/><path d="M512 400 L325 240"/>
      <path d="M512 400 L699 240"/><path d="M512 400 L300 320"/><path d="M512 400 L724 320"/>
    </g>
